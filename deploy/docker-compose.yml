# Usage (from this directory):
#   cp ../.env.example ../.env   # then set APP_KEYS and DOMAIN
#   docker compose --env-file ../.env up -d --build
services:
  proxy:
    build:
      context: ..
      dockerfile: apps/proxy/Dockerfile
    env_file: ../.env
    environment:
      TRUST_PROXY: "true"
    expose:
      - "8080"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
